# MkDocs Material configuration for the Troika documentation site.
# Built and deployed to GitHub Pages by .github/workflows/docs.yml.
site_name: Troika
site_description: >-
  Troika is an AI coding-agent pipeline for full-stack developers: it turns a
  tracker ticket into a reviewed, QA-verified pull request. Planning, parallel
  implementation, automated code review, unit tests, QA proofs, release PRs,
  release notes and demo builds — as a plugin for Claude Code, Codex and Cursor.
site_author: Troika contributors
# Canonical site URL — drives sitemap.xml, canonical <link> tags and social cards.
site_url: https://vsdudakov.github.io/troika/
repo_name: vsdudakov/troika
repo_url: https://github.com/vsdudakov/troika
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Troika contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/transit-connection-variant
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  # Generates Open Graph / Twitter social cards per page (needs the
  # `[imaging]` extra + system Cairo). Enabled only in CI (the docs workflow
  # installs Cairo); skipped locally so `mkdocs serve` works without it.
  - social:
      enabled: !ENV [CI, false]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  homepage: https://vsdudakov.github.io/troika/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vsdudakov/troika
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/vsdudakov
      name: Sponsor Troika
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Set up a workspace: getting-started/workspace.md
      - Your first ticket: getting-started/first-ticket.md
  - Concepts:
      - The pipeline: concepts/pipeline.md
      - Roles: concepts/roles.md
      - Skills: concepts/skills.md
      - Handoff and worktrees: concepts/handoff.md
      - Paths and the resolver: concepts/paths.md
      - Models and effort: concepts/models.md
  - Guides:
      - Writing the profile: guides/profile.md
      - The nine review checks: guides/review.md
      - Releasing a change: guides/release.md
      - Adding a role: guides/adding-a-role.md
      - Adding a skill: guides/adding-a-skill.md
      - Running without a plugin: guides/no-plugin.md
  - Reference:
      - Commands: reference/commands.md
      - .troika.json: reference/troika-json.md
      - AGENTS.md anchors: reference/agents-md.md
      - Plugin manifests: reference/manifests.md
      - Releases and versioning: reference/releases.md
  - Testing: testing.md
  - Contributing: contributing.md
